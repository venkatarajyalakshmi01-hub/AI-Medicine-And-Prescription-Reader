<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Prescription Scanner</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Cropper.js -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">

    <style>

        .preview-container {
            display: none;
            margin-top: 25px;
            text-align: center;
        }

        .preview-container img {
            max-width: 100%;
            max-height: 500px;
            display: block;
            margin: auto;
        }

        .crop-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .crop-buttons button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .crop-btn {
            background: #0d6efd;
            color: white;
        }

        .reset-btn {
            background: #6c757d;
            color: white;
        }

        .scan-btn {
            background: #198754;
            color: white;
        }

        .crop-help {
            margin-top: 12px;
            font-size: 14px;
            color: #666;
        }

    </style>

</head>


<body>

    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">
            💊 AI Medicine Reminder
        </div>

        <div class="nav-links">

            <a href="/">Home</a>

            <a href="/dashboard">Dashboard</a>

            <a href="/medicines">Medicines</a>

            <a href="/history">History</a>

        </div>

    </nav>


    <!-- Upload Section -->

    <section class="upload-section">

        <div class="upload-box">

            <h1>📄 Prescription Scanner</h1>

            <p>
                Upload your prescription and crop the medicine
                section before scanning.
            </p>


            <!-- File Selection -->

            <input
                type="file"
                id="prescriptionInput"
                accept="image/*"
                required
            >


            <!-- Image Preview -->

            <div class="preview-container"
                 id="previewContainer">

                <h3>✂️ Edit / Crop Prescription</h3>

                <img id="prescriptionImage"
                     alt="Prescription Preview">

                <p class="crop-help">
                    Drag the box around the medicine section
                    you want to scan.
                </p>


                <div class="crop-buttons">

                    <button
                        type="button"
                        class="crop-btn"
                        onclick="cropImage()">

                        ✂️ Crop Image

                    </button>


                    <button
                        type="button"
                        class="reset-btn"
                        onclick="resetCrop()">

                        🔄 Reset

                    </button>

                </div>

            </div>


            <!-- Upload Form -->

            <form
                id="scanForm"
                action="/upload-prescription"
                method="POST"
                enctype="multipart/form-data">

                <input
                    type="hidden"
                    name="cropped_image"
                    id="croppedImage"
                >


                <button
                    type="submit"
                    class="scan-btn"
                    id="scanButton"
                    style="display:none;">

                    🔍 Scan Prescription

                </button>

            </form>

        </div>

    </section>


    <!-- Cropper.js -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>


    <script>

        let cropper = null;

        const input =
            document.getElementById("prescriptionInput");

        const image =
            document.getElementById("prescriptionImage");

        const previewContainer =
            document.getElementById("previewContainer");

        const croppedImageInput =
            document.getElementById("croppedImage");

        const scanButton =
            document.getElementById("scanButton");


        /* Select Image */

        input.addEventListener("change", function(event) {

            const file = event.target.files[0];

            if (!file) {
                return;
            }


            const reader = new FileReader();


            reader.onload = function(e) {

                image.src = e.target.result;

                previewContainer.style.display = "block";

                scanButton.style.display = "none";


                if (cropper) {
                    cropper.destroy();
                }


                image.onload = function() {

                    cropper = new Cropper(
                        image,
                        {
                            viewMode: 1,
                            autoCropArea: 0.8,
                            responsive: true,
                            background: false
                        }
                    );

                };

            };


            reader.readAsDataURL(file);

        });


        /* Crop Image */

        function cropImage() {

            if (!cropper) {

                alert("Please select an image first.");

                return;
            }


            const canvas =
                cropper.getCroppedCanvas({
                    imageSmoothingEnabled: true,
                    imageSmoothingQuality: "high"
                });


            const croppedData =
                canvas.toDataURL("image/png");


            croppedImageInput.value =
                croppedData;


            scanButton.style.display =
                "inline-block";


            alert(
                "Image cropped successfully. Now click Scan Prescription."
            );

        }


        /* Reset Crop */

        function resetCrop() {

            if (cropper) {
                cropper.reset();
            }

            croppedImageInput.value = "";

            scanButton.style.display = "none";

        }

    </script>


</body>

</html>
